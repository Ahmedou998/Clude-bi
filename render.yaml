databases:
  - name: teranga-gp-db
    databaseName: teranga_gp
    user: teranga_gp
    plan: basic-256mb
    region: frankfurt

services:
  - type: web
    name: teranga-gp
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run db:push && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: teranga-gp-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # Pilote : le code de connexion s'affiche à l'écran. Passer à "false" et définir OTP_WEBHOOK_URL pour un usage réel.
      - key: ALLOW_DEMO_OTP
        value: "true"
      - key: PAYMENT_PROVIDER
        value: simulation
